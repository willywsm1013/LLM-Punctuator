[project]
name = "llm-punctuator"
version = "0.1.0"
description = "Use LLM as a punctuator by constraining the next predicting tokens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "transformers",
    "torch",
    "protobuf",
    "sentencepiece",
    "tqdm",
    "pydantic",
    "accelerate",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "D",   # pydocstyle (docstrings)
    "T20", # flake8-print (forbid print statements)
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20", "D"]  # CLI scripts: allow print and relaxed docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
